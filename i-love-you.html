<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>I Love You</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(135deg, #2b0a2f, #5c0f3e, #8e1050);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Arial, sans-serif;
    position: relative;
    cursor: pointer;
  }

  .container {
    text-align: center;
    z-index: 5;
  }

  .heart-beat {
    font-size: 80px;
    animation: beat 1.1s infinite;
    filter: drop-shadow(0 0 20px rgba(255, 90, 140, 0.8));
  }

  @keyframes beat {
    0%, 100% { transform: scale(1); }
    25% { transform: scale(1.2); }
    40% { transform: scale(0.95); }
    60% { transform: scale(1.15); }
  }

  h1 {
    margin-top: 20px;
    font-size: 3rem;
    background: linear-gradient(90deg, #ff9a9e, #fecfef, #ff9a9e);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 3s linear infinite;
    letter-spacing: 2px;
  }

  @keyframes shine {
    to { background-position: 200% center; }
  }

  p.sub {
    margin-top: 12px;
    color: #ffd7e8;
    font-size: 1rem;
    opacity: 0.8;
  }

  .float {
    position: absolute;
    bottom: -50px;
    font-size: 24px;
    animation: rise linear forwards;
    pointer-events: none;
    user-select: none;
  }

  @keyframes rise {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
  }
</style>
</head>
<body>

  <div class="container">
    <div class="heart-beat">❤️</div>
    <h1>I Love You</h1>
    <p class="sub">click anywhere for more hearts ✨</p>
  </div>

<script>
  const body = document.body;
  const emojis = ['❤️', '💖', '💕', '💗', '💘'];

  function spawnHeart(x) {
    const heart = document.createElement('div');
    heart.classList.add('float');
    heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    heart.style.left = x + 'px';
    heart.style.fontSize = (16 + Math.random() * 22) + 'px';
    const duration = 4 + Math.random() * 3;
    heart.style.animationDuration = duration + 's';
    body.appendChild(heart);
    setTimeout(() => heart.remove(), duration * 1000);
  }

  // ambient floating hearts
  setInterval(() => {
    spawnHeart(Math.random() * window.innerWidth);
  }, 400);

  // burst of hearts on click/tap
  body.addEventListener('click', (e) => {
    for (let i = 0; i < 8; i++) {
      setTimeout(() => spawnHeart(e.clientX + (Math.random() * 80 - 40)), i * 40);
    }
  });
</script>

</body>
</html>
